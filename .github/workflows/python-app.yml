name: Python Tkinter CI/CD Pipeline

on:
  push:
    branches: ["dev", "main"]

  pull_request:
    branches: ["dev", "main"]


jobs:

  # =========================================================
  # JOB 1: AUTOMATED TESTING (CI)
  # Runs when pushing to 'sub-main' or 'main'
  # =========================================================

  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4


    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"


    - name: Install Tkinter
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk


    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip

        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

        pip install pytest flake8


    - name: Check Python Code
      run: |
        flake8 . --count \
          --select=E9,F63,F7,F82 \
          --show-source \
          --statistics


    - name: Run Automated Tests
      run: |
        pytest


  # =========================================================
  # JOB 2: SIMULATED DEPLOYMENT (CD)
  # Runs ONLY on 'main' branch AFTER tests pass
  # =========================================================

  deploy:
    name: Deploy Tkinter Application
    runs-on: ubuntu-latest

    needs: test

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:

    - name: Simulate Deployment Output
      run: |
        echo "🚀 Starting Tkinter Application Deployment..."
        echo "ℹ️ Simulation Mode: Actual server deployment is skipped."
        echo "✅ Tkinter Application Deployment Completed Successfully!"